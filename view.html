<!DOCTYPE html>
<nav class="navbar navbar-dark bg-success">
  <div class="container">
    <span class="navbar-brand">🍱 Enjoy every meal with us</span>
  </div>
</nav>
<html>
<head>
    <title>View Donations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
</nav>
    <h2 class="text-center mb-4">Available Food Donations</h2><div id="donationList"></div>
</div>

<script>
let donations = JSON.parse(localStorage.getItem("donations")) || [];

let container = document.getElementById("donationList");

if(donations.length === 0){
    container.innerHTML = "<h4 class='text-center'>No donations available</h4>";
}
else{
    donations.forEach((d,index) => {
        container.innerHTML += `
            <div class="card mb-3">
                <div class="card-body">
                    <h5>${d.donor}</h5>
                    <p><b>Location:</b> ${d.location}</p>
                    <p><b>Food Quantity:</b> ${d.quantity}</p>
                    <p><b>Contact:</b> ${d.contact}</p>
                        <button class="btn btn-danger" onclick="deleteDonation(${index})">Delete</button>
                </div>
            </div>
        `;
    });
}

function deleteDonation(index){
    donations.splice(index,1);
    localStorage.setItem("donations", JSON.stringify(donations));
    location.reload();
}
</script>
</body>
</html>
